name: Bug report
description: 报告一个 bug / Report a bug
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: 问题描述 / Description
      description: 请描述你遇到的问题，以及期望的行为。
      placeholder: 发生了什么？期望是什么？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      description: package.json 中的版本号，或 GitHub commit。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 操作系统、Node 版本、DSH 版本。
      placeholder: macOS 14 / Node 20 / DSH 0.1.0-rc.6
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: 如果有关，请粘贴脱敏后的日志（注意隐藏 token / 密钥）。
      render: shell
