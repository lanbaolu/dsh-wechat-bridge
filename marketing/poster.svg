<svg xmlns="http://www.w3.org/2000/svg" width="1242" height="1656" viewBox="0 0 1242 1656">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#152238"/>
      <stop offset="0.55" stop-color="#0D1424"/>
      <stop offset="1" stop-color="#0A0E1A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4DF3FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4DF3FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#07C160" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#07C160" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4DF3FF"/>
      <stop offset="0.5" stop-color="#07C160"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07C160"/>
      <stop offset="1" stop-color="#4D6BFE"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- 背景 -->
  <rect width="1242" height="1656" fill="url(#bg)"/>
  <rect width="1242" height="1656" fill="url(#grid)"/>
  <circle cx="170" cy="220" r="230" fill="url(#glow1)"/>
  <circle cx="1080" cy="700" r="300" fill="url(#glow2)"/>
  <circle cx="620" cy="1500" r="320" fill="url(#glow1)"/>

  <!-- 顶部标签 -->
  <rect x="451" y="78" width="340" height="56" rx="28" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.18"/>
  <circle cx="487" cy="106" r="6" fill="#4DF3FF"/>
  <circle cx="511" cy="106" r="6" fill="#07C160"/>
  <circle cx="535" cy="106" r="6" fill="#4D6BFE"/>
  <text x="565" y="114" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="25" fill="#E6EDF7">开源 · 本地 · 微信直连</text>

  <!-- 标题 -->
  <text x="621" y="205" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="52" font-weight="700" fill="url(#titleGrad)" letter-spacing="1">把 DeepSeek Harness 塞进微信的正确姿势</text>
  <text x="621" y="264" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" fill="#8B96AB" letter-spacing="1">扫码绑定 · 微信聊天框直连本机 DeepSeek Harness</text>

  <!-- ============ 手机 mock（主视觉） ============ -->
  <g>
    <!-- 机身 -->
    <rect x="301" y="340" width="640" height="766" rx="56" fill="#1C1C1E" stroke="#3A3A3C" stroke-width="3"/>
    <!-- 屏幕 -->
    <rect x="315" y="354" width="612" height="738" rx="40" fill="#F7F7F7"/>
    <clipPath id="screen">
      <rect x="315" y="354" width="612" height="738" rx="40"/>
    </clipPath>

    <g clip-path="url(#screen)">
      <!-- 状态栏 -->
      <text x="342" y="386" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" font-weight="600" fill="#111111">9:41</text>
      <rect x="792" y="366" width="18" height="10" rx="2.5" fill="none" stroke="#111111" stroke-width="1.5"/>
      <rect x="794" y="368" width="10" height="6" rx="1" fill="#111111"/>
      <rect x="816" y="365" width="3" height="12" rx="1" fill="#111111"/>
      <rect x="754" y="367" width="4" height="9" rx="1" fill="#111111"/>
      <rect x="762" y="367" width="4" height="9" rx="1" fill="#111111"/>
      <rect x="770" y="367" width="4" height="9" rx="1" fill="#111111"/>

      <!-- 导航栏 -->
      <rect x="315" y="398" width="612" height="64" fill="#EDEDED"/>
      <rect x="315" y="461" width="612" height="1" fill="#D8D8D8"/>
      <text x="338" y="438" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="28" fill="#111111">‹</text>
      <text x="621" y="440" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="600" fill="#111111">DeepSeek 助手</text>
      <text x="908" y="438" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" fill="#111111">⋯</text>

      <!-- 消息区 -->

      <!-- 右·文字 1 -->
      <rect x="571" y="482" width="342" height="46" rx="16" fill="#95EC69"/>
      <path d="M 571 516 L 561 524 L 571 532 Z" fill="#95EC69"/>
      <text x="591" y="511" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#111111">帮我看看这个报错</text>

      <!-- 右·代码截图（用户发的图片） -->
      <rect x="649" y="540" width="264" height="112" rx="10" fill="#1E2430"/>
      <rect x="667" y="556" width="150" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="667" y="571" width="190" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="667" y="586" width="130" height="7" rx="3.5" fill="#E5484D"/>
      <rect x="667" y="601" width="170" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="667" y="616" width="110" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="667" y="631" width="150" height="7" rx="3.5" fill="#3A4358"/>
      <path d="M 649 586 L 621 586 L 626 578 L 632 586 L 636 578 L 641 586 Z" fill="#E5484D"/>

      <!-- 左·代码回复（DS 的回答） -->
      <rect x="373" y="668" width="360" height="140" rx="14" fill="#0C1019" stroke="#2A3550" stroke-width="1.5"/>
      <path d="M 733 772 L 743 780 L 733 788 Z" fill="#0C1019"/>
      <rect x="393" y="688" width="160" height="7" rx="3.5" fill="#4DF3FF"/>
      <rect x="393" y="705" width="220" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="393" y="722" width="120" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="393" y="739" width="190" height="7" rx="3.5" fill="#3A4358"/>
      <rect x="393" y="756" width="240" height="7" rx="3.5" fill="#3A4358"/>
      <text x="393" y="792" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="16" fill="#9AA5B5">→ await 时序问题，已帮你调整</text>

      <!-- 左·文字 2 -->
      <rect x="373" y="820" width="300" height="46" rx="16" fill="#FFFFFF"/>
      <path d="M 673 848 L 683 856 L 673 864 Z" fill="#FFFFFF"/>
      <text x="393" y="849" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#111111">改好了，测试重跑全绿</text>

      <!-- 右·文字 3 -->
      <rect x="601" y="878" width="312" height="46" rx="16" fill="#95EC69"/>
      <path d="M 601 912 L 591 920 L 601 928 Z" fill="#95EC69"/>
      <text x="621" y="907" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#111111">顺便把周三评审列个提纲</text>

      <!-- 左·提纲 -->
      <rect x="373" y="936" width="330" height="80" rx="16" fill="#FFFFFF"/>
      <path d="M 703 990 L 713 998 L 703 1006 Z" fill="#FFFFFF"/>
      <text x="393" y="967" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#111111">1. 目标 2. 进度 3. 风险</text>
      <text x="393" y="997" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#111111">4. 决策项 5. 待办分工</text>

      <!-- 输入条 -->
      <rect x="315" y="1028" width="612" height="64" fill="#F0F0F0"/>
      <rect x="331" y="1042" width="492" height="36" rx="18" fill="#FFFFFF"/>
      <text x="351" y="1065" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#B0B0B0">给 DeepSeek 发消息…</text>
      <circle cx="842" cy="1060" r="21" fill="url(#btnGrad)"/>
      <path d="M 834 1058 L 834 1062 L 847 1060 Z" fill="#FFFFFF"/>
      <rect x="836" y="1054" width="2" height="12" fill="#FFFFFF" transform="rotate(38 837 1060)"/>
    </g>
  </g>

  <!-- ============ 卖点四横排 ============ -->
  <!-- 本地私有 -->
  <g>
    <rect x="36" y="1168" width="270" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="145" y="1190" width="52" height="52" rx="26" fill="#07C160" fill-opacity="0.16"/>
    <rect x="159" y="1215" width="24" height="17" rx="3" fill="none" stroke="#4DF3FF" stroke-width="2.5"/>
    <path d="M 163 1215 v -5 a 8 8 0 0 1 16 0 v 5" fill="none" stroke="#4DF3FF" stroke-width="2.5"/>
    <circle cx="171" cy="1222" r="2.5" fill="#4DF3FF"/>
    <text x="171" y="1272" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">本地私有</text>
    <text x="171" y="1304" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19" fill="#9AA5B5">数据不出电脑</text>
  </g>
  <!-- 上下文不断档 -->
  <g>
    <rect x="336" y="1168" width="270" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="445" y="1190" width="52" height="52" rx="26" fill="#4D6BFE" fill-opacity="0.16"/>
    <path d="M 467 1206 a 9 9 0 1 1 -9 9" fill="none" stroke="#4DF3FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 458 1220 l -6 1 l 4 -5 Z" fill="#4DF3FF"/>
    <path d="M 467 1234 a 9 9 0 1 1 -9 -9" fill="none" stroke="#4DF3FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 459 1223 l 2 5 l 4 -4 Z" fill="#4DF3FF"/>
    <text x="471" y="1272" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">上下文不断档</text>
    <text x="471" y="1304" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19" fill="#9AA5B5">重启自动续聊</text>
  </g>
  <!-- 图文双向 -->
  <g>
    <rect x="636" y="1168" width="270" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="745" y="1190" width="52" height="52" rx="26" fill="#4DF3FF" fill-opacity="0.14"/>
    <rect x="759" y="1202" width="22" height="17" rx="3" fill="none" stroke="#07C160" stroke-width="2.5"/>
    <path d="M 762 1214 l 5 -5 l 4 4 l 4 -3 l 5 5" fill="none" stroke="#07C160" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="774" cy="1206" r="2" fill="#07C160"/>
    <text x="771" y="1272" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">图文双向</text>
    <text x="771" y="1304" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19" fill="#9AA5B5">图片 / 文件 / 语音</text>
  </g>
  <!-- 三端通用 -->
  <g>
    <rect x="936" y="1168" width="270" height="160" rx="20" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.14"/>
    <rect x="1045" y="1190" width="52" height="52" rx="26" fill="#FFB020" fill-opacity="0.14"/>
    <polygon points="1071,1197 1056,1213 1065,1213 1063,1223 1078,1207 1069,1207" fill="#FFB020"/>
    <text x="1071" y="1272" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">三端通用</text>
    <text x="1071" y="1304" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="19" fill="#9AA5B5">Win · Mac · Linux</text>
  </g>

  <!-- 底部 -->
  <text x="621" y="1412" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="26" fill="#9AA5B5">GitHub · github.com/lanbaolu/dsh-wechat-bridge</text>
  <text x="621" y="1462" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="17" fill="#5E6A82">基于 iLink Bot 非官方微信协议 · 请评估账号风险后使用 · 建议小号测试</text>
  <rect x="571" y="1486" width="100" height="1.5" fill="#2A3550"/>
  <text x="621" y="1514" text-anchor="middle" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" fill="#55607A" letter-spacing="3">DSH · DEEPSEEK HARNESS</text>
</svg>
