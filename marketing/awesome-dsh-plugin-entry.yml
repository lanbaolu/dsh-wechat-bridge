# @lanbaolu/dsh-wechat-bridge — 插件市场（dsh-market）收录提交条目草稿
#
# 目标库：https://github.com/awesome-dsh-plugin/awesome-dsh-plugin
# 提交方式：PR 新增 data/plugins/lanbaolu__dsh-wechat-bridge.yml（本文件内容），
#   然后在该库跑 `npm ci && node scripts/generate-readme.mjs` 重新生成 README 一起提交。
#
# 分类说明：选 notify（通知与集成）。市场里既有微信/iLink/飞书桥全部归在 notify，
#   便于用户横向比较；remote（远程与移动端）为备选。维护者会按实际功能微调分类，
#   分类选得不够准不会被拒。
#
# 描述规范：一句话、以句号结尾、只陈述事实不带营销词；描述会被维护者当作声明与
#   代码逐条核对（工具名、命令、API 都必须真实存在）。

url: https://github.com/lanbaolu/dsh-wechat-bridge
name: lanbaolu/dsh-wechat-bridge
category: notify
description:
  en: 'Two-way WeChat bridge for DeepSeek Harness via the iLink protocol: bind your personal WeChat with a QR scan and chat with a local DSH agent from the chat box (text, images, voice-to-text, files); a web settings panel handles binding/start/stop/status, project-session binding continues the conversation on desktop, proactive wechat_notify pushes include throttling, and the pure-Node daemon runs on Windows/macOS/Linux.'
  zh: 基于 iLink 协议的 DSH 微信双向桥：扫码绑定个人微信后在聊天框直接与本机 DSH Agent 对话（文字/图片/语音转文字/文件），Web 设置面板管理扫码绑定/启停/状态，支持绑定项目会话跨端续聊，agent 可主动 wechat_notify 推送（内置节流），纯 Node 守护进程，Windows/macOS/Linux 三端通用。
